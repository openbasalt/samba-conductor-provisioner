# nfpm configuration of the "conductor-provisioner" package, one file for
# the .deb and the .rpm. Built by packaging/build.sh, which sets ARCH,
# PKG_VERSION, PKG_REVISION, BUILD (staging directory) and SOURCE_DATE_EPOCH
# (every timestamp). Paths are relative to the repository root. Entries
# marked "packager: deb" or "packager: rpm" exist in one format only (Debian
# keeps docs and licenses in /usr/share/doc and sets modes in postinst;
# Fedora keeps licenses in /usr/share/licenses and owns its directories in
# the payload).
name: conductor-provisioner
arch: ${ARCH}
platform: linux
version: ${PKG_VERSION}
version_schema: none
release: ${PKG_REVISION}
section: admin
priority: optional
maintainer: Samba Conductor maintainers <samba-conductor@openbasalt.org>
vendor: OpenBasalt
homepage: https://github.com/openbasalt/samba-conductor-provisioner
license: Apache-2.0
description: |-
  delegated Active Directory writes for Samba Conductor
  conductor-provisioner holds a least-privilege account delegated on the
  managed OUs of a Samba Active Directory domain and executes typed
  operations for conductor over a local socket: one-time invitation and
  password reset tokens, password set, lockout clear, account enable and
  the Google-first plan operations. Its own rules (scope, privileged
  accounts, hourly ceilings, token binding) hold even if conductor is
  compromised, and every change and refusal is audited.
  .
  Nothing is started at installation (see the README in
  /usr/share/doc/conductor-provisioner).

depends:
  - systemd | systemd-standalone-sysusers | systemd-sysusers
suggests:
  - conductor

rpm:
  summary: Delegated Active Directory writes for Samba Conductor
  group: Applications/System
  buildhost: build.samba-conductor.openbasalt.org
  compression: zstd

overrides:
  deb:
    scripts:
      postinstall: packaging/scripts/postinst
      preremove: packaging/scripts/prerm
      postremove: packaging/scripts/postrm
  rpm:
    depends:
      - systemd
      # The SELinux policy wherever the targeted policy is installed
      # (Fedora, Basalt OS): installed first, so the files get their labels;
      # the same version, so an upgrade of the package upgrades its policy.
      - (conductor-provisioner-selinux = ${PKG_VERSION}-${PKG_REVISION} if selinux-policy-targeted)
    suggests:
      - conductor
    scripts:
      preinstall: packaging/rpm/pre
      postinstall: packaging/rpm/post
      preremove: packaging/rpm/preun
      postremove: packaging/rpm/postun

contents:
  - expand: true
    src: ${BUILD}/bin/conductor-provisioner
    dst: /usr/bin/conductor-provisioner
    file_info: {mode: 0755}
  - expand: true
    src: ${BUILD}/systemd/conductor-provisioner.service
    dst: /usr/lib/systemd/system/conductor-provisioner.service
    file_info: {mode: 0644}
  - expand: true
    src: ${BUILD}/systemd/conductor-provisioner-api.socket
    dst: /usr/lib/systemd/system/conductor-provisioner-api.socket
    file_info: {mode: 0644}
  - src: packaging/sysusers.conf
    dst: /usr/lib/sysusers.d/conductor-provisioner.conf
    file_info: {mode: 0644}
  # Configuration. Debian: modes from postinst (dpkg-statoverride).
  - src: provisioner.toml.example
    dst: /etc/conductor-provisioner/provisioner.toml
    type: config|noreplace
    packager: deb
    file_info: {mode: 0644}
  # Fedora: the package owns its directories with their final modes.
  - dst: /etc/conductor-provisioner
    type: dir
    packager: rpm
    file_info: {mode: 0750, owner: root, group: conductor-provisioner}
  - src: provisioner.toml.example
    dst: /etc/conductor-provisioner/provisioner.toml
    type: config|noreplace
    packager: rpm
    file_info: {mode: 0640, owner: root, group: conductor-provisioner}
  # The credentials are read by systemd (LoadCredential=) and by root's
  # manual "status" and "audit verify": root only.
  - dst: /etc/conductor-provisioner/credentials
    type: dir
    packager: rpm
    file_info: {mode: 0700, owner: root, group: root}
  - dst: /var/lib/conductor-provisioner
    type: dir
    packager: rpm
    file_info: {mode: 0700, owner: conductor-provisioner, group: conductor-provisioner}
  # A plain file in the .deb, a documentation file (%doc) in the .rpm.
  - expand: true
    src: ${BUILD}/man/conductor-provisioner.8.gz
    dst: /usr/share/man/man8/conductor-provisioner.8.gz
    packager: deb
    file_info: {mode: 0644}
  - expand: true
    src: ${BUILD}/man/conductor-provisioner.8.gz
    dst: /usr/share/man/man8/conductor-provisioner.8.gz
    type: doc
    packager: rpm
    file_info: {mode: 0644}
  # Debian documentation and licenses.
  - src: packaging/copyright
    dst: /usr/share/doc/conductor-provisioner/copyright
    packager: deb
    file_info: {mode: 0644}
  - src: NOTICE
    dst: /usr/share/doc/conductor-provisioner/NOTICE
    packager: deb
    file_info: {mode: 0644}
  - expand: true
    src: ${BUILD}/doc/conductor-provisioner/THIRD-PARTY-LICENSES.gz
    dst: /usr/share/doc/conductor-provisioner/THIRD-PARTY-LICENSES.gz
    packager: deb
    file_info: {mode: 0644}
  - expand: true
    src: ${BUILD}/doc/conductor-provisioner/changelog.Debian.gz
    dst: /usr/share/doc/conductor-provisioner/changelog.Debian.gz
    packager: deb
    file_info: {mode: 0644}
  - src: packaging/README.Debian
    dst: /usr/share/doc/conductor-provisioner/README.Debian
    packager: deb
    file_info: {mode: 0644}
  - src: packaging/lintian-overrides
    dst: /usr/share/lintian/overrides/conductor-provisioner
    packager: deb
    file_info: {mode: 0644}

  # Fedora documentation and licenses (%license, %doc), in directories the
  # package owns (removed with it).
  - dst: /usr/share/doc/conductor-provisioner
    type: dir
    packager: rpm
    file_info: {mode: 0755}
  - dst: /usr/share/licenses/conductor-provisioner
    type: dir
    packager: rpm
    file_info: {mode: 0755}
  - src: LICENSE
    dst: /usr/share/licenses/conductor-provisioner/LICENSE
    type: license
    packager: rpm
    file_info: {mode: 0644}
  - src: NOTICE
    dst: /usr/share/licenses/conductor-provisioner/NOTICE
    type: license
    packager: rpm
    file_info: {mode: 0644}
  - expand: true
    src: ${BUILD}/doc/conductor-provisioner/THIRD-PARTY-LICENSES
    dst: /usr/share/licenses/conductor-provisioner/THIRD-PARTY-LICENSES
    type: license
    packager: rpm
    file_info: {mode: 0644}
  - src: packaging/rpm/README.Fedora
    dst: /usr/share/doc/conductor-provisioner/README.Fedora
    type: doc
    packager: rpm
    file_info: {mode: 0644}
